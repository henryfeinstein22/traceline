<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traceline — Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="index.html"><span class="mark"></span>Traceline</a>
    <nav><a href="parent.html">Parent dashboard</a></nav>
  </div>

  <div id="findFamily">
    <header class="hero" style="margin-bottom:16px;">
      <p class="eyebrow">Kid chat</p>
      <h1 style="font-size:22px;">What's your family name?</h1>
    </header>
    <div class="panel">
      <div class="field">
        <label for="famNameInput">Family name</label>
        <input type="text" id="famNameInput" placeholder="e.g. The Feinsteins">
      </div>
      <button class="btn" onclick="findFamily()">Next</button>
      <div id="findError" class="error-msg"></div>
    </div>
  </div>

  <div id="pickKid" style="display:none;">
    <header class="hero" style="margin-bottom:16px;">
      <h1 style="font-size:22px;">Who's chatting?</h1>
    </header>
    <div class="panel" id="kidPickerPanel"></div>
  </div>

  <div id="convoPicker" style="display:none;">
    <div class="topbar" style="margin-bottom:12px;">
      <h1 style="font-size:20px; margin:0;" id="kidGreeting"></h1>
      <button class="btn secondary" onclick="backToFamily()">Not you?</button>
    </div>
    <div class="panel">
      <h2>Your chats</h2>
      <div id="convosForKid"></div>
      <details style="margin-top:12px;" open>
        <summary style="cursor:pointer; font-size:13px; color:var(--ink-soft);">+ start a new chat</summary>
        <div style="margin-top:14px;">
          <div class="field">
            <label>What kind of chat is this?</label>
            <div class="tabs" id="modeTabs">
              <button type="button" class="mode-btn active" onclick="setMode('general', this)">Just chatting</button>
              <button type="button" class="mode-btn" onclick="setMode('homework', this)">Homework help</button>
              <button type="button" class="mode-btn" onclick="setMode('decision', this)">Decide &amp; plan</button>
            </div>
            <p class="note" id="modeCaption" style="margin-top:8px; margin-bottom:0;"></p>
          </div>
          <div class="field"><label for="newTitle">Give it a short title</label><input type="text" id="newTitle" placeholder="e.g. Science project on volcanoes"></div>
          <button class="btn" onclick="startConvo()">Start chat</button>
        </div>
      </details>
    </div>
  </div>

  <div id="chatView" style="display:none;">
    <div class="topbar" style="margin-bottom:12px;">
      <h1 style="font-size:18px; margin:0;" id="chatTitle"></h1>
      <button class="btn secondary" onclick="backToConvoPicker()">← back</button>
    </div>
    <div class="chat-shell">
      <div class="chat-topbar">
        <span class="title" id="chatTopbarTitle"></span>
        <span id="hwBadge" class="badge hw" style="display:none;">homework — logged for provenance</span>
        <span id="decideBadge" class="badge decide" style="display:none;">decide &amp; plan</span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn" id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
    <p class="note">Every message here (yours and the AI's) is logged and safety-checked. A parent can see this conversation on their dashboard.</p>
  </div>
</div>

<script>
let familyId = null, familyName = null, kidId = null, kidName = null, convoId = null, convoMode = 'general';
let newConvoMode = 'general';

const MODE_INFO = {
  general: { label: null, caption: 'A regular chat — not saved as a homework record.' },
  homework: { label: 'homework — logged for provenance', caption: 'Keeps a shareable record showing how you worked through it, so you can share it with a teacher.' },
  decision: { label: 'decide & plan', caption: "Helps you think through a choice or plan a routine — Traceline won't decide for you, just help you think it through." },
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// The AI often replies with light markdown (**bold**, "- " lists) even
// though this is a plain-text bubble — escape first, then turn just that
// syntax into real markup so it doesn't show as literal asterisks/dashes.
function renderMarkup(text) {
  let s = esc(text);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.split('\n').map(line => line.replace(/^(\s*)[-*]\s+/, '$1• ')).join('<br>');
  return s;
}

function setMode(mode, btn) {
  newConvoMode = mode;
  document.querySelectorAll('#modeTabs .mode-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('modeCaption').textContent = MODE_INFO[mode].caption;
}
document.getElementById('modeCaption').textContent = MODE_INFO.general.caption;

async function findFamily() {
  const name = document.getElementById('famNameInput').value.trim();
  const err = document.getElementById('findError');
  err.textContent = '';
  if (!name) { err.textContent = 'Enter a family name.'; return; }
  try {
    const res = await fetch('/api/family/by-name/' + encodeURIComponent(name));
    if (!res.ok) throw new Error("Couldn't find that family. Ask a parent to set one up first.");
    const fam = await res.json();
    familyId = fam.id; familyName = fam.familyName;
    await loadKidPicker();
  } catch (e) {
    err.textContent = e.message;
  }
}

async function loadKidPicker() {
  const res = await fetch('/api/family/' + familyId + '/kids');
  const kids = await res.json();
  const panel = document.getElementById('kidPickerPanel');
  if (kids.length === 0) {
    panel.innerHTML = '<p class="empty">No kid profiles yet — ask a parent to add one on the dashboard first.</p>';
  } else {
    panel.innerHTML = '';
    kids.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'btn secondary';
      btn.style.display = 'block';
      btn.style.width = '100%';
      btn.style.marginBottom = '8px';
      btn.textContent = k.name;
      btn.onclick = () => selectKid(k.id, k.name);
      panel.appendChild(btn);
    });
  }
  document.getElementById('findFamily').style.display = 'none';
  document.getElementById('pickKid').style.display = 'block';
}

function selectKid(id, name) {
  kidId = id; kidName = name;
  document.getElementById('kidGreeting').textContent = 'Hi, ' + name + '!';
  document.getElementById('pickKid').style.display = 'none';
  document.getElementById('convoPicker').style.display = 'block';
  loadConvosForKid();
}

function backToFamily() {
  document.getElementById('convoPicker').style.display = 'none';
  document.getElementById('findFamily').style.display = 'block';
}

async function loadConvosForKid() {
  const res = await fetch('/api/kids/' + kidId + '/conversations');
  const convos = await res.json();
  const el = document.getElementById('convosForKid');
  el.innerHTML = convos.length === 0 ? '<p class="empty">No chats yet — start one below.</p>' : '';
  convos.forEach(c => {
    const div = document.createElement('div');
    div.className = 'convo-row';
    const mode = c.mode || (c.homeworkMode ? 'homework' : 'general');
    const badge = mode === 'homework' ? '<span class="badge hw">homework</span>' : mode === 'decision' ? '<span class="badge decide">decide &amp; plan</span>' : '';
    div.innerHTML = `<div class="convo-top"><span class="convo-title">${esc(c.title)}</span>${badge}</div><div class="convo-meta">${c.messages.length} messages</div>`;
    div.addEventListener('click', () => openChat(c.id, c.title, mode));
    el.appendChild(div);
  });
}

async function startConvo() {
  const title = document.getElementById('newTitle').value.trim() || 'New chat';
  const res = await fetch('/api/kids/' + kidId + '/conversations', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, mode: newConvoMode }),
  });
  const convo = await res.json();
  openChat(convo.id, convo.title, convo.mode);
}

function openChat(id, title, mode) {
  convoId = id; convoMode = mode || 'general';
  document.getElementById('chatTitle').textContent = title;
  document.getElementById('chatTopbarTitle').textContent = title;
  document.getElementById('hwBadge').style.display = convoMode === 'homework' ? 'inline-block' : 'none';
  document.getElementById('decideBadge').style.display = convoMode === 'decision' ? 'inline-block' : 'none';
  document.getElementById('convoPicker').style.display = 'none';
  document.getElementById('chatView').style.display = 'block';
  loadMessages();
}

function backToConvoPicker() {
  document.getElementById('chatView').style.display = 'none';
  document.getElementById('convoPicker').style.display = 'block';
  loadConvosForKid();
}

async function loadMessages() {
  const res = await fetch('/api/conversations/' + convoId);
  const convo = await res.json();
  renderMessages(convo.messages);
}

function timeLabel(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function renderMessages(messages) {
  const el = document.getElementById('chatMessages');
  el.innerHTML = '';
  messages.forEach(m => el.appendChild(buildMessageEl(m)));
  el.scrollTop = el.scrollHeight;
}

function buildMessageEl(m) {
  if (m.role === 'tip') {
    const div = document.createElement('div');
    div.className = 'msg tip';
    div.innerHTML = '<span class="tip-label">💡 AI TIP</span>' + esc(m.content);
    return div;
  }
  const group = document.createElement('div');
  group.className = 'msg-group ' + m.role;
  if (m.role === 'assistant') {
    const sender = document.createElement('div');
    sender.className = 'msg-sender';
    sender.innerHTML = '<span class="dot"></span> Traceline AI';
    group.appendChild(sender);
  }
  const bubble = document.createElement('div');
  bubble.className = 'msg ' + m.role + (m.flagged ? ' flagged' : '');
  bubble.innerHTML = renderMarkup(m.content);
  group.appendChild(bubble);
  if (m.role === 'assistant') {
    const verifyBtn = document.createElement('button');
    verifyBtn.type = 'button';
    verifyBtn.className = 'verify-btn';
    verifyBtn.textContent = 'How do you know that?';
    verifyBtn.onclick = askHowDoYouKnow;
    group.appendChild(verifyBtn);
  }
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = timeLabel(m.ts);
  group.appendChild(time);
  return group;
}

function askHowDoYouKnow() {
  if (document.getElementById('sendBtn').disabled) return;
  document.getElementById('chatInput').value = "How do you know that? What could I check to make sure it's right?";
  sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;

  // Optimistic: show the kid's message immediately, then a typing indicator,
  // instead of a silent pause while the real AI call is in flight.
  const el = document.getElementById('chatMessages');
  el.appendChild(buildMessageEl({ role: 'kid', content: text, ts: Date.now(), flagged: false }));
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg assistant typing';
  typingDiv.id = 'typingIndicator';
  typingDiv.innerHTML = '<span></span><span></span><span></span>';
  el.appendChild(typingDiv);
  el.scrollTop = el.scrollHeight;

  try {
    await fetch('/api/conversations/' + convoId + '/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
  } catch (e) {
    // fall through to reload either way, which will show accurate state
  }
  await loadMessages();
  sendBtn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
